<main class="page wrap"><section class="intro"><span class="eyebrow">04 / MUSIC COLLECTION</span><h1>我的唱片室<span style="color:var(--accent)">.</span></h1><p>一面专辑墙，一张正在细看的唱片。慢慢收集，慢慢分享。</p><div class="rule"></div></section>
<section class="music-stage" aria-label="播放器舞台"><div class="card music-disc-panel"><div id="music-disc" class="music-disc" aria-hidden="true"><div class="music-disc-core">♫</div></div><h2 id="music-now-title">选一张专辑</h2><p id="music-now-artist">下方唱片墙中点选</p><div class="music-progress"><i></i></div><div class="music-controls"><button type="button" id="music-prev" aria-label="上一张专辑">‹</button><button class="main-play" type="button" id="music-play" aria-label="播放示意">▶</button><button type="button" id="music-next" aria-label="下一张专辑">›</button></div><p style="margin-top:14px;font-size:10px">试听控件为视觉示意 · 未接入音源</p></div><div class="card music-info"><div class="music-tabs" role="tablist" aria-label="专辑信息"><button type="button" role="tab" aria-selected="true" class="active" data-music-tab="about">介绍</button><button type="button" role="tab" aria-selected="false" data-music-tab="tracks">曲目</button></div><div id="music-info-content" class="music-info-content"><div><h3>从唱片墙选一张专辑</h3><p>这里会显示你写的推荐语与曲目。<br>还可以接入正版平台的官方播放器。</p></div></div></div></section>
<section aria-label="专辑墙"><div class="music-wall-heading"><div><span class="micro">RECORD SHELF / CANDIDATES</span><h2>专辑墙</h2></div><span id="album-count" class="count"></span></div><div id="music-wall" class="music-wall"></div><p class="note">专辑名单是你之前提出的候选清单；封面来自 Cover Art Archive；推荐语和曲目仍待填写，播放器尚未接入。</p></section></main>
